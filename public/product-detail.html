<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhe do Produto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top right,
          #fff2e1 0%,
          #ffe3c2 38%,
          #f9efe4 100%);
      min-height: 100vh;
      color: #2f2f2f;
      padding: 22px;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-back {
      background: #fff;
      color: #a95500;
      border: 1px solid #ffd2a6;
    }

    .btn-buy {
      background: linear-gradient(135deg, #ff8c00 0%, #ff6900 100%);
      color: white;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(70, 40, 10, 0.12);
      overflow: hidden;
    }

    .hero {
      padding: 22px;
      border-bottom: 1px solid #ffe0bf;
      background: linear-gradient(130deg, #fff8ef 0%, #fff2df 100%);
    }

    .hero h1 {
      font-size: 28px;
      color: #6f3400;
      margin-bottom: 8px;
    }

    .hero p {
      color: #6f5a48;
      font-size: 15px;
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
    }

    .photo-wrap {
      padding: 22px;
      border-right: 1px solid #f5eee5;
      background: #fff;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrap img {
      width: 100%;
      max-width: 420px;
      object-fit: contain;
    }

    .specs {
      padding: 22px;
    }

    .price-block {
      margin-bottom: 12px;
    }

    .price-original {
      font-size: 15px;
      color: #9d8b78;
      text-decoration: line-through;
      margin-bottom: 2px;
      min-height: 20px;
    }

    .price-final {
      font-size: 34px;
      font-weight: 800;
      color: #2f2f2f;
    }

    .discount-note {
      margin-top: 8px;
      display: inline-block;
      font-size: 13px;
      color: #8a4a00;
      background: #fff5e9;
      border: 1px solid #ffd7ae;
      border-radius: 999px;
      padding: 6px 10px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .badge.in-stock {
      background: #ebf9ef;
      color: #1b7b3c;
      border: 1px solid #bde9c9;
    }

    .badge.out-stock {
      background: #ffefef;
      color: #b22d2d;
      border: 1px solid #ffd2d2;
    }

    .list {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #faf7f3;
      border: 1px solid #f4e9dc;
    }

    .row span:first-child {
      color: #7e6f5f;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .footer .btn {
      width: 100%;
      max-width: 280px;
      text-align: center;
    }

    .footer .btn+.btn {
      opacity: 0.95;
    }

    .error {
      color: #b22d2d;
      background: #fff2f2;
      border: 1px solid #ffd5d5;
      border-radius: 10px;
      padding: 12px;
      display: none;
    }

    @media (max-width: 880px) {
      .content {
        grid-template-columns: 1fr;
      }

      .photo-wrap {
        border-right: none;
        border-bottom: 1px solid #f5eee5;
        min-height: 300px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    window.__SERVER_ORIGIN = "{{SERVER_ORIGIN}}";
    window.__PRESELECTED_PRODUCT_ID = "{{PRODUCT_ID}}";
    window.__INITIAL_PRODUCT = {{ PRODUCT_DATA }};
    window.__INITIAL_USER = {{ USER_DATA }};
  </script>
  <script type="module" src="{{SERVER_ORIGIN}}/assets/product-detail-widget.js"></script>
</body>

</html>
