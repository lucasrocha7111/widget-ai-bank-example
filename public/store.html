<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja Itau React</title>
    <style>
      :root {
        color-scheme: light;
        --orange-1: #ff9e2f;
        --orange-2: #e36700;
        --slate-1: #101a2f;
        --slate-2: #28446e;
        --ink: #102139;
        --muted: #6f7f96;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 8% 0%, #ffe8c7 0%, transparent 42%),
          linear-gradient(135deg, #f8f7f5 0%, #edf4ff 100%);
        color: var(--ink);
      }

      #root {
        min-height: 100vh;
      }

      .shell {
        max-width: 1020px;
        margin: 0 auto;
        padding: 20px;
      }

      .hero {
        color: #fff;
        border-radius: 18px;
        padding: 28px;
        background:
          linear-gradient(
            120deg,
            var(--slate-1) 0%,
            var(--slate-2) 55%,
            #365f97 100%
          ),
          repeating-linear-gradient(
            -35deg,
            rgba(255, 255, 255, 0.06) 0,
            rgba(255, 255, 255, 0.06) 8px,
            rgba(255, 255, 255, 0) 8px,
            rgba(255, 255, 255, 0) 16px
          );
        box-shadow: 0 18px 40px rgba(24, 34, 58, 0.28);
      }

      .kicker {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.84;
      }

      .hero h1 {
        margin: 8px 0;
        font-size: 28px;
      }

      .hero p {
        margin: 0;
        max-width: 640px;
        opacity: 0.92;
      }

      .card {
        margin-top: 16px;
        border-radius: 18px;
        padding: 20px;
        background: var(--surface);
        box-shadow: 0 10px 28px rgba(16, 33, 57, 0.12);
      }

      .search {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .search input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #d9e1ed;
        padding: 12px 14px;
        font-size: 14px;
      }

      .search button,
      .actions button,
      .actions a {
        border-radius: 12px;
        border: none;
        padding: 11px 16px;
        cursor: pointer;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
        font-weight: 600;
        font-size: 13px;
      }

      .search button:disabled,
      .actions button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .answer {
        margin: 12px 0 0;
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid #f4d2b0;
        background: #fff8f0;
      }

      .product {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 14px;
        border: 1px solid #e3e9f3;
        border-radius: 14px;
        padding: 14px;
        background: #fcfeff;
      }

      .product img {
        width: 100%;
        height: 220px;
        object-fit: contain;
      }

      .product h2 {
        margin: 0;
      }

      .product p {
        margin: 8px 0;
      }

      .price {
        font-size: 26px;
        font-weight: 700;
      }

      .stock {
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .actions .secondary {
        background: linear-gradient(135deg, #2866b7, #1d4f91);
      }

      .feedback {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 14px;
      }

      .feedback.ok {
        background: #ecf9ef;
        color: #116028;
        border: 1px solid #bde8c7;
      }

      .feedback.err {
        background: #fff2f2;
        color: #9f2424;
        border: 1px solid #f7cccc;
      }

      .flight-hero,
      .flight-form,
      .flight-result {
        margin-top: 16px;
        border-radius: 18px;
        border: 1px solid #d8e7ff;
        overflow: hidden;
        background: linear-gradient(180deg, #f7fbff 0%, #ffffff 100%);
        box-shadow: 0 12px 32px rgba(16, 33, 57, 0.08);
      }

      .flight-hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        min-height: 280px;
      }

      .flight-art {
        position: relative;
        min-height: 280px;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.9) 0 14px,
            transparent 15px
          ),
          radial-gradient(
            circle at 40% 22%,
            rgba(255, 255, 255, 0.75) 0 10px,
            transparent 11px
          ),
          linear-gradient(135deg, #0d3b78 0%, #2563c6 52%, #62b0ff 100%);
      }

      .flight-sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.18) 0 18px,
            transparent 19px
          ),
          radial-gradient(
            circle at 40% 28%,
            rgba(255, 255, 255, 0.18) 0 12px,
            transparent 13px
          ),
          radial-gradient(
            circle at 74% 24%,
            rgba(255, 255, 255, 0.14) 0 16px,
            transparent 17px
          );
      }

      .flight-cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        filter: blur(0.1px);
      }

      .flight-cloud::before,
      .flight-cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: inherit;
      }

      .flight-cloud.cloud-a {
        width: 92px;
        height: 28px;
        left: 18%;
        top: 18%;
      }

      .flight-cloud.cloud-a::before {
        width: 34px;
        height: 34px;
        left: 10px;
        top: -12px;
      }

      .flight-cloud.cloud-a::after {
        width: 40px;
        height: 40px;
        right: 10px;
        top: -16px;
      }

      .flight-cloud.cloud-b {
        width: 72px;
        height: 24px;
        left: 62%;
        top: 22%;
      }

      .flight-cloud.cloud-b::before {
        width: 30px;
        height: 30px;
        left: 4px;
        top: -10px;
      }

      .flight-cloud.cloud-b::after {
        width: 34px;
        height: 34px;
        right: 6px;
        top: -12px;
      }

      .flight-cloud.cloud-c {
        width: 120px;
        height: 30px;
        left: 48%;
        bottom: 18%;
        opacity: 0.75;
      }

      .flight-cloud.cloud-c::before {
        width: 38px;
        height: 38px;
        left: 16px;
        top: -14px;
      }

      .flight-cloud.cloud-c::after {
        width: 46px;
        height: 46px;
        right: 16px;
        top: -18px;
      }

      .flight-trail {
        position: absolute;
        left: 14%;
        top: 58%;
        width: 42%;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.85)
        );
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.6);
        transform: rotate(-7deg);
      }

      .flight-plane {
        position: absolute;
        right: 16%;
        top: 34%;
        font-size: 78px;
        transform: rotate(12deg);
        filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.18));
      }

      .flight-copy {
        padding: 24px;
      }

      .flight-kicker {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #4b7fd9;
        font-size: 12px;
        font-weight: 700;
      }

      .flight-copy h2,
      .flight-form h3,
      .flight-result h2 {
        margin: 0 0 8px;
        color: var(--ink);
      }

      .flight-copy p,
      .flight-result p {
        margin: 0;
        color: #51637f;
      }

      .flight-points {
        margin: 18px 0;
        padding: 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, #0f2f58, #1c61bf);
        color: #fff;
        display: grid;
        gap: 6px;
      }

      .flight-points-label,
      .flight-points-note {
        opacity: 0.88;
        font-size: 13px;
      }

      .flight-points strong {
        font-size: 24px;
        line-height: 1;
      }

      .flight-btn {
        border: none;
        border-radius: 14px;
        padding: 12px 16px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #0d3b78, #2d7cf0);
        cursor: pointer;
      }

      .flight-form,
      .flight-result {
        padding: 20px;
      }

      .flight-form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .flight-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .flight-form .form-group {
        margin-bottom: 0;
      }

      .flight-form .secondary-btn {
        flex: 0 0 auto;
      }

      .flight-actions {
        margin-top: 14px;
      }

      .flight-result.success {
        border: 1px solid #7dd37a;
        background: linear-gradient(135deg, #f0fff2, #f5fbff);
      }

      .flight-result.pending {
        border: 1px solid #bfd4f7;
      }

      .flight-result-top {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
      }

      .flight-result-plane {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        font-size: 40px;
        color: #fff;
        background: linear-gradient(135deg, #0d3b78, #2d7cf0);
        box-shadow: 0 14px 26px rgba(13, 59, 120, 0.28);
      }

      .flight-meter {
        margin-top: 18px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        display: grid;
        gap: 10px;
      }

      .flight-meter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
      }

      .flight-meter-row span {
        color: #51637f;
      }

      .flight-meter-row.highlight {
        padding: 12px;
        border-radius: 12px;
        background: rgba(13, 59, 120, 0.08);
      }

      .result-actions {
        margin-top: 16px;
      }

      /* Cover Competitor Price Styles */
      .cover-btn {
        margin-top: 14px;
        width: 100%;
        border-radius: 12px;
        border: 2px solid var(--orange-1);
        padding: 12px 16px;
        cursor: pointer;
        background: #fff;
        color: var(--orange-2);
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .cover-btn:hover {
        background: #fff8f0;
      }

      .cover-form {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #e3e9f3;
        border-radius: 12px;
        background: #fcfeff;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--ink);
      }

      .form-group input {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #d9e1ed;
        padding: 10px 12px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--orange-1);
        box-shadow: 0 0 0 3px rgba(255, 158, 47, 0.1);
      }

      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .primary-btn,
      .secondary-btn {
        border-radius: 8px;
        border: none;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        flex: 1;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
        color: #fff;
      }

      .primary-btn:hover:not(:disabled) {
        opacity: 0.9;
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .secondary-btn {
        background: #e8ecf4;
        color: var(--ink);
      }

      .secondary-btn:hover {
        background: #d9e1ed;
      }

      /* Cover Result Styles */
      .cover-result {
        margin-top: 16px;
        padding: 24px;
        border-radius: 14px;
        text-align: center;
      }

      .cover-result.success {
        background: linear-gradient(135deg, #ecf9ef 0%, #e8f5f8 100%);
        border: 2px solid #7fdf6f;
      }

      .cover-success-badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 12px;
        background: linear-gradient(135deg, #52c41a, #3fa915);
        color: #fff;
        font-size: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      .cover-result h2 {
        margin: 0 0 16px;
        font-size: 28px;
        color: #3fa915;
      }

      .cover-details {
        margin: 20px 0;
        text-align: left;
        background: rgba(255, 255, 255, 0.6);
        padding: 16px;
        border-radius: 10px;
      }

      .detail-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .detail-item:last-child {
        border-bottom: none;
      }

      .detail-item .label {
        font-weight: 600;
        color: var(--ink);
        font-size: 14px;
      }

      .detail-item .value {
        font-size: 14px;
        color: #41536f;
      }

      .detail-item .value.original {
        text-decoration: line-through;
        color: #9f9f9f;
      }

      .detail-item .value.price-highlight {
        font-size: 18px;
        font-weight: 700;
        color: var(--orange-2);
      }

      .detail-item .value.savings {
        font-size: 16px;
        font-weight: 700;
        color: #3fa915;
      }

      .detail-item.highlight {
        background: rgba(255, 158, 47, 0.1);
        padding: 12px;
        border-radius: 8px;
        margin: 8px 0;
      }

      .detail-item.discount {
        background: rgba(82, 196, 26, 0.1);
        padding: 12px;
        border-radius: 8px;
        margin: 8px 0;
      }

      .cover-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .cover-actions .primary-btn,
      .cover-actions .secondary-btn {
        flex: 1;
      }

      .invest-shell {
        margin-top: 18px;
        border-radius: 18px;
        border: 1px solid #d9e6fb;
        background:
          radial-gradient(circle at 90% 0%, #edf6ff 0%, transparent 40%),
          linear-gradient(180deg, #f9fcff 0%, #ffffff 100%);
        padding: 18px;
        box-shadow: 0 12px 26px rgba(16, 33, 57, 0.08);
      }

      .invest-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .invest-kicker {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 11px;
        color: #4c74b8;
        font-weight: 700;
      }

      .invest-head h2 {
        margin: 6px 0 0;
        font-size: 24px;
      }

      .invest-note {
        margin: 10px 0 0;
        color: #4e6383;
        font-size: 14px;
      }

      .ob-pill-row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ob-pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: linear-gradient(135deg, #0f3570, #1f5fb6);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 10px;
      }

      .ob-pill.muted {
        background: #e9f0fb;
        color: #36517c;
        font-weight: 600;
      }

      .invest-summary-grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .invest-summary-card {
        border-radius: 12px;
        border: 1px solid #d8e4f8;
        background: #ffffff;
        padding: 12px;
      }

      .invest-summary-card span {
        display: block;
        color: #536888;
        font-size: 12px;
      }

      .invest-summary-card strong {
        display: block;
        margin-top: 6px;
        font-size: 19px;
        color: #102139;
      }

      .invest-summary-card.highlight {
        border-color: #f1c58d;
        background: linear-gradient(135deg, #fff4e8, #fffaf4);
      }

      .bank-grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .bank-card {
        border-radius: 14px;
        border: 1px solid #dde8f8;
        background: #fff;
        padding: 14px;
      }

      .bank-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .bank-top h3 {
        margin: 0;
        font-size: 18px;
      }

      .bank-top span {
        font-size: 12px;
        color: #5d7191;
        background: #eef4ff;
        padding: 4px 8px;
        border-radius: 999px;
      }

      .bank-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }

      .bank-metrics p {
        margin: 0;
        border-radius: 10px;
        border: 1px solid #e8eef9;
        background: #fbfdff;
        padding: 8px;
      }

      .bank-metrics span {
        display: block;
        font-size: 11px;
        color: #5d7191;
      }

      .bank-metrics strong {
        display: block;
        margin-top: 4px;
        font-size: 14px;
      }

      .inv-list {
        display: grid;
        gap: 8px;
      }

      .inv-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        border-radius: 10px;
        border: 1px solid #eef2f8;
        background: #fcfdff;
        padding: 10px;
      }

      .inv-name {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .inv-meta {
        margin: 4px 0 0;
        color: #5f7394;
        font-size: 12px;
      }

      .inv-values {
        text-align: right;
      }

      .inv-values span {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #0f2f58;
      }

      .inv-values small {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: #637895;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(14, 22, 38, 0.62);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 16px;
      }

      .modal-card {
        width: min(440px, 100%);
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid #e5ebf5;
        box-shadow: 0 24px 40px rgba(10, 20, 36, 0.24);
        padding: 18px;
      }

      .modal-card h3 {
        margin: 0 0 8px;
      }

      .modal-card p {
        margin: 0;
        color: #41536f;
      }

      .modal-actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      @media (max-width: 760px) {
        .hero h1 {
          font-size: 22px;
        }

        .search {
          grid-template-columns: 1fr;
        }

        .product {
          grid-template-columns: 1fr;
        }

        .flight-hero,
        .flight-form-grid,
        .flight-result-top {
          grid-template-columns: 1fr;
        }

        .flight-plane {
          right: 10%;
          top: 30%;
          font-size: 64px;
        }

        .invest-summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .bank-grid,
        .bank-metrics {
          grid-template-columns: 1fr;
        }

        .invest-head {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__SERVER_ORIGIN = "{{SERVER_ORIGIN}}";
      window.__STORE_PURCHASE_DEEPLINK = "{{STORE_PURCHASE_DEEPLINK}}";
    </script>
    <script
      type="module"
      src="{{SERVER_ORIGIN}}/assets/store-widget.js"
    ></script>
  </body>
</html>
