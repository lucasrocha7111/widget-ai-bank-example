<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja Itau React</title>
    <style>
      :root {
        color-scheme: light;
        --orange-1: #ff9e2f;
        --orange-2: #e36700;
        --slate-1: #101a2f;
        --slate-2: #28446e;
        --ink: #102139;
        --muted: #6f7f96;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 8% 0%, #ffe8c7 0%, transparent 42%),
          linear-gradient(135deg, #f8f7f5 0%, #edf4ff 100%);
        color: var(--ink);
      }

      #root {
        min-height: 100vh;
      }

      .shell {
        max-width: 1020px;
        margin: 0 auto;
        padding: 20px;
      }

      .hero {
        color: #fff;
        border-radius: 18px;
        padding: 28px;
        background:
          linear-gradient(
            120deg,
            var(--slate-1) 0%,
            var(--slate-2) 55%,
            #365f97 100%
          ),
          repeating-linear-gradient(
            -35deg,
            rgba(255, 255, 255, 0.06) 0,
            rgba(255, 255, 255, 0.06) 8px,
            rgba(255, 255, 255, 0) 8px,
            rgba(255, 255, 255, 0) 16px
          );
        box-shadow: 0 18px 40px rgba(24, 34, 58, 0.28);
      }

      .kicker {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.84;
      }

      .hero h1 {
        margin: 8px 0;
        font-size: 28px;
      }

      .hero p {
        margin: 0;
        max-width: 640px;
        opacity: 0.92;
      }

      .card {
        margin-top: 16px;
        border-radius: 18px;
        padding: 20px;
        background: var(--surface);
        box-shadow: 0 10px 28px rgba(16, 33, 57, 0.12);
      }

      .search {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .search input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #d9e1ed;
        padding: 12px 14px;
        font-size: 14px;
      }

      .search button,
      .actions button,
      .actions a {
        border-radius: 12px;
        border: none;
        padding: 11px 16px;
        cursor: pointer;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
        font-weight: 600;
        font-size: 13px;
      }

      .search button:disabled,
      .actions button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .answer {
        margin: 12px 0 0;
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid #f4d2b0;
        background: #fff8f0;
      }

      .product {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 14px;
        border: 1px solid #e3e9f3;
        border-radius: 14px;
        padding: 14px;
        background: #fcfeff;
      }

      .product img {
        width: 100%;
        height: 220px;
        object-fit: contain;
      }

      .product h2 {
        margin: 0;
      }

      .product p {
        margin: 8px 0;
      }

      .price {
        font-size: 26px;
        font-weight: 700;
      }

      .stock {
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .actions .secondary {
        background: linear-gradient(135deg, #2866b7, #1d4f91);
      }

      .feedback {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 14px;
      }

      .feedback.ok {
        background: #ecf9ef;
        color: #116028;
        border: 1px solid #bde8c7;
      }

      .feedback.err {
        background: #fff2f2;
        color: #9f2424;
        border: 1px solid #f7cccc;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(14, 22, 38, 0.62);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 16px;
      }

      .modal-card {
        width: min(440px, 100%);
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid #e5ebf5;
        box-shadow: 0 24px 40px rgba(10, 20, 36, 0.24);
        padding: 18px;
      }

      .modal-card h3 {
        margin: 0 0 8px;
      }

      .modal-card p {
        margin: 0;
        color: #41536f;
      }

      .modal-actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      @media (max-width: 760px) {
        .hero h1 {
          font-size: 22px;
        }

        .search {
          grid-template-columns: 1fr;
        }

        .product {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__SERVER_ORIGIN = "{{SERVER_ORIGIN}}";
      window.__STORE_PURCHASE_DEEPLINK = "{{STORE_PURCHASE_DEEPLINK}}";
    </script>
    <script
      type="module"
      src="{{SERVER_ORIGIN}}/assets/store-widget.js"
    ></script>
  </body>
</html>
